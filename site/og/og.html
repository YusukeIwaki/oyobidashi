<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Oyobidashi｜OGP画像 (1200 × 630)</title>
  <!-- App Storeのプロダクトページ用ヘッダと同じ絵柄を、リンクカードの比率に組み直したもの。
       書き出しは ./site/scripts/og-image.sh (出力: site/public/og.png)。 -->
  <style>
    :root {
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      --ink: #26241e;
      --green: #254d38;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    h1, p { margin: 0; }
    img { display: block; }

    .art {
      position: relative;
      isolation: isolate;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(ellipse at 74% 50%, #fbd49c 0%, #fce4bd 21%, transparent 51%),
        linear-gradient(114deg, #eed5ad 0%, #fbedd4 28%, #fcf2df 51%, #f8dfb9 100%);
    }
    .art::before {
      position: absolute;
      inset: 0;
      content: "";
      background: radial-gradient(circle, rgb(96 70 39 / 23%) 1px, transparent 1.6px) 0 0 / 10px 10px;
      mask-image: linear-gradient(90deg, #000 0%, transparent 30%, transparent 72%, #000 100%);
    }
    .rings {
      position: absolute;
      inset: 0;
      background: repeating-radial-gradient(
        ellipse 372px 268px at 74% 50%,
        transparent 0 32%, rgb(163 77 32 / 17%) 32.2% 32.7%, transparent 32.9% 47%
      );
      mask-image:
        radial-gradient(ellipse 258px 181px at 74% 50%, transparent 97%, #000 99%),
        linear-gradient(90deg, transparent 30%, #000 62%, #0009 100%);
      mask-composite: intersect;
    }
    .copy {
      position: absolute;
      left: 109px;
      top: 163px;
      width: 552px;
    }
    .copy h1 { font-size: 86px; font-weight: 750; line-height: 1.23; letter-spacing: -0.035em; }
    .copy h1 span { display: block; font-size: 102px; color: var(--green); }
    .copy p { margin-top: 25px; font-size: 32px; font-weight: 650; letter-spacing: -0.025em; }
    .pager {
      position: absolute;
      left: 685px;
      top: 110px;
      width: 410px;
      height: 410px;
      mix-blend-mode: darken;
    }
    .pager-shadow {
      position: absolute;
      left: 743px;
      top: 446px;
      width: 295px;
      height: 44px;
      background: radial-gradient(ellipse closest-side, #71462469, transparent);
      filter: blur(10px);
    }
  </style>
</head>
<body>
  <div class="art">
    <div class="rings"></div>
    <div class="pager-shadow"></div>
    <img class="pager" src="pager.png" alt="">
    <div class="copy">
      <h1>AIが電話で<span>お呼び出し</span></h1>
      <p>ひとこと答えて、作業を先へ。</p>
    </div>
  </div>
</body>
</html>

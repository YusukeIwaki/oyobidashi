name: Oyobidashi
options:
  bundleIdPrefix: me.oyobidashi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja
packages:
  OyobidashiKit:
    path: OyobidashiKit
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Oyobidashi:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      - path: ../site/src/content/privacy-policy.json
        buildPhase: resources
    dependencies:
      - package: OyobidashiKit
      - target: OyobidashiNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.oyobidashi.ios
        PRODUCT_NAME: Oyobidashi
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "5"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: お呼び出し
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: me.oyobidashi.ios.pair
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - oyobidashi
        NSFaceIDUsageDescription: クラウドアカウントの削除時に本人確認を行います。
        NSCameraUsageDescription: ペアリング用のQRコードを読み取るためにカメラを使用します。
        NSMicrophoneUsageDescription: エージェントからの質問に音声で回答するためにマイクを使用します。
        NSSpeechRecognitionUsageDescription: 音声での回答を文字に変換するために音声認識を使用します。
        NSLocalNetworkUsageDescription: 同じWi‑Fi上のMacで動いている中継サーバーに接続して、質問の受信と回答の送信を行います。
        # 中継サーバーは LAN 内のプライベートIP宛ての平文 HTTP / WS。
        # NSAllowsLocalNetworking は IP アドレス・.local・ドット無しホスト名への接続だけを ATS の対象外にする。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - voip
          - remote-notification
          - audio
    entitlements:
      path: App/Oyobidashi.entitlements
      properties:
        aps-environment: development
        com.apple.developer.devicecheck.appattest-environment: development
        com.apple.developer.usernotifications.time-sensitive: true

  OyobidashiNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes: [Info.plist]
    dependencies:
      - package: OyobidashiKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.oyobidashi.ios.NotificationService
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "5"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: お呼び出し通知
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
